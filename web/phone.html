<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Muscle Memory — phone sensor</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
  @font-face{
    font-family:"Airbnb Cereal";
    src:url("/static/fonts/AirbnbCereal_W_Bk.otf") format("opentype");
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{ --ink:#fff; --ink2:#d3d2c9; --muted:#94928b; --blue:#3987e5;
         --edge:rgba(255,255,255,.10); --glass:rgba(24,24,30,.55); }
  *{box-sizing:border-box}
  body{margin:0; min-height:100dvh; color:var(--ink);
       background:
         radial-gradient(700px 500px at 15% -10%, rgba(57,135,229,.20), transparent 60%),
         radial-gradient(600px 450px at 110% 110%, rgba(217,89,38,.14), transparent 60%),
         linear-gradient(160deg,#0b0b11,#0a0a0e);
       font:16px/1.5 "Airbnb Cereal VF","Airbnb Cereal App","Airbnb Cereal",
            "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex; flex-direction:column; align-items:center; justify-content:center;
       gap:22px; padding:24px; text-align:center}
  h1{font-size:1.1em; letter-spacing:.09em; margin:0; font-weight:800}
  #start{color:#fff; border:1px solid rgba(255,255,255,.22); border-radius:99px;
         font:700 1.2em/1 inherit; padding:22px 44px; cursor:pointer;
         background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.02)), var(--blue);
         box-shadow:0 10px 30px rgba(57,135,229,.35);
         -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px)}
  #start:disabled{opacity:.4; box-shadow:none}
  #bar{width:min(340px,80vw); height:18px; border-radius:99px; overflow:hidden;
       background:var(--glass); border:1px solid var(--edge);
       -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px)}
  #fill{height:100%; width:0; background:linear-gradient(90deg,var(--blue),#7db4f0)}
  #status{color:var(--muted); min-height:3em; max-width:36ch}
  #match{color:var(--ink2); font-weight:700; min-height:1.5em}
</style>
</head>
<body>
<h1>MUSCLE MEMORY · PHONE</h1>
<button id="start">Start streaming motion</button>
<div id="bar"><div id="fill"></div></div>
<div id="match"></div>
<div id="status">Press start, allow motion access, then move the phone like a
task — whisk, hammer, pour, wipe…</div>
<script>
"use strict";
const status = (m) => document.getElementById("status").textContent = m;
let ws = null, buf = [];

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/phone`);
  ws.onopen = () => status("connected — move the phone!");
  ws.onclose = () => { status("connection lost, retrying…"); setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "matches" && msg.matches.length) {
      const m = msg.matches[0];
      document.getElementById("match").textContent =
        `top match: ${m.task.replace(/[_-]+/g, " ")} (${m.score.toFixed(2)})`;
    }
  };
}

function onMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration || {};
  const r = e.rotationRate || {};
  const d2r = Math.PI / 180;
  buf.push([performance.now() / 1000,
            a.x || 0, a.y || 0, a.z || 0,
            (r.alpha || 0) * d2r, (r.beta || 0) * d2r, (r.gamma || 0) * d2r]);
  const mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
  document.getElementById("fill").style.width =
    Math.min(100, Math.abs(mag - 9.81) * 12) + "%";
}

setInterval(() => {
  if (ws && ws.readyState === 1 && buf.length) {
    ws.send(JSON.stringify({ samples: buf }));
    buf = [];
  }
}, 150);

document.getElementById("start").addEventListener("click", async () => {
  try {
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
      const p = await DeviceMotionEvent.requestPermission();  // iOS gate (needs HTTPS)
      if (p !== "granted") { status("motion permission denied — on iOS this page must be served over HTTPS (use the cloudflared tunnel), or use an Android phone."); return; }
    }
    window.addEventListener("devicemotion", onMotion);
    document.getElementById("start").disabled = true;
    connect();
  } catch (err) {
    status("motion sensors unavailable: " + err + " — try Android/Chrome or the HTTPS tunnel.");
  }
});
</script>
</body>
</html>
