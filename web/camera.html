<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Muscle Memory — camera source</title>
<link rel="icon" href="data:,">
<style>
  :root{ --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7;
         --muted:#898781; --blue:#3987e5; --good:#5cff9d; --bad:#ff5c5c; }
  *{box-sizing:border-box}
  body{margin:0; min-height:100dvh; background:var(--page); color:var(--ink);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex; flex-direction:column; align-items:center;
       gap:16px; padding:20px; text-align:center}
  h1{font-size:1.05em; letter-spacing:.08em; margin:0}
  button{background:var(--blue); color:#fff; border:0; border-radius:14px;
         font:600 1.1em/1 inherit; padding:18px 34px; cursor:pointer}
  button:disabled{opacity:.4}
  /* iOS won't decode a display:none video — drawImage would copy blank
     frames with no error. Keep it in layout, just invisible. */
  video{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
  canvas{width:min(320px,84vw); border-radius:12px; background:#000;
         border:1px solid #2a2a28}
  #stats{display:flex; gap:18px; font:14px/1.4 ui-monospace,Menlo,monospace;
         color:var(--ink2); flex-wrap:wrap; justify-content:center}
  #status{color:var(--muted); max-width:34ch; min-height:3em}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
       background:var(--bad);vertical-align:middle;margin-right:5px}
  .dot.ok{background:var(--good)}
  label{color:var(--muted); font-size:14px; display:flex; align-items:center; gap:8px}
</style>
</head>
<body>
<h1>MUSCLE MEMORY · CAMERA SOURCE</h1>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div id="stats">
  <span><span class="dot" id="dot"></span><span id="state">idle</span></span>
  <span id="fps">0.0 fps</span>
  <span id="kb">0 KB</span>
  <span id="sent">0 sent</span>
</div>
<label><input type="checkbox" id="rear" checked> rear camera</label>
<label>size
  <select id="size">
    <option value="small">small 320x240</option>
    <option value="medium" selected>medium 400x300</option>
    <option value="large">large 512x384</option>
  </select>
</label>
<label>quality
  <select id="q">
    <option value="0.35">low</option>
    <option value="0.45" selected>medium</option>
    <option value="0.6">high</option>
  </select>
</label>
<button id="start">Start camera</button>
<div id="status">Point this phone at the work. Frames go to the server; the
  glasses pull the newest one. Keep the screen awake — iOS suspends capture
  when the display sleeps.</div>

<script>
"use strict";
/* ---------------------------------------------------------------------------
   Capture source for the MRBD pipeline.

   This page does NOT run on the glasses — MRBD Web Apps have no camera, and
   the paired phone is a transport relay rather than a device the glasses page
   can address. So a normal phone browser captures here, POSTs JPEGs to the
   server, and /glasses pulls the newest frame as an <img>. Same shape as the
   robot-arm camera will be: only the source changes.

   getUserMedia requires a secure context, so this must be loaded over the
   HTTPS tunnel, not a LAN IP.
--------------------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const v = $("v"), c = $("c"), ctx = c.getContext("2d");

const SEND_MS = 150;      // ~6.7 fps ceiling; the glasses poll slower than this

// The glasses render into a 600x600 box, so a tall portrait frame spends most
// of its bytes on letterbox bars that get thrown away. Centre-crop to 4:3 and
// send only what can actually be shown -- roughly a third of the pixels, and
// the pull leg to the glasses is bandwidth-bound, so that is most of the frame
// rate. Presets are exposed because the right one depends on the venue's link.
const PRESETS = { small: [320, 240], medium: [400, 300], large: [512, 384] };
let TARGET = PRESETS.medium;
let QUALITY = 0.45;

let timer = null, inflight = false, sent = 0, lastTick = performance.now(), frames = 0;

function setState(text, ok){
  $("state").textContent = text;
  $("dot").className = "dot" + (ok ? " ok" : "");
}

async function pushFrame(){
  // Drop rather than queue: a slow link should cost frames, never latency.
  if (inflight) return;
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", QUALITY));
  if (!blob) return;
  inflight = true;
  try {
    const res = await fetch("/api/cam/push", {
      method: "POST",
      headers: { "Content-Type": "image/jpeg" },
      body: blob,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    sent++; frames++;
    $("sent").textContent = sent + " sent";
    $("kb").textContent = (blob.size / 1024).toFixed(0) + " KB";
    setState("streaming", true);
  } catch (err) {
    setState("push failed", false);
  } finally {
    inflight = false;
  }
}

function draw(){
  if (v.videoWidth){
    const [tw, th] = TARGET;
    if (c.width !== tw){ c.width = tw; c.height = th; }
    // Centre-crop the source to the target aspect, so holding the phone
    // upright still yields the landscape view a fixed camera would give.
    const srcAR = v.videoWidth / v.videoHeight, dstAR = tw / th;
    let sw = v.videoWidth, sh = v.videoHeight, sx = 0, sy = 0;
    if (srcAR > dstAR){ sw = v.videoHeight * dstAR; sx = (v.videoWidth - sw) / 2; }
    else              { sh = v.videoWidth / dstAR;  sy = (v.videoHeight - sh) / 2; }
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, tw, th);
  }
  requestAnimationFrame(draw);
}

setInterval(() => {
  const now = performance.now();
  $("fps").textContent = (frames / ((now - lastTick) / 1000)).toFixed(1) + " fps";
  frames = 0; lastTick = now;
}, 1000);

// Safari can restore this page from the back-forward cache with the button
// still disabled from a previous run, which looks exactly like a dead button.
// Never trust the restored state.
$("start").disabled = false;
$("size").addEventListener("change", (e) => { TARGET = PRESETS[e.target.value]; });
$("q").addEventListener("change", (e) => { QUALITY = parseFloat(e.target.value); });

$("start").addEventListener("click", async () => {
  try {
    $("start").disabled = true;
    $("start").textContent = "Starting…";
    setState("requesting camera", false);
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: $("rear").checked ? "environment" : "user",
               width: { ideal: 960 } },
      audio: false,
    });
    v.srcObject = stream;
    await v.play();
    $("start").textContent = "Streaming";
    $("status").textContent = "Streaming. Open /glasses on the Meta Ray-Ban " +
      "Display and pick Camera feed.";
    draw();
    timer = setInterval(pushFrame, SEND_MS);
    setState("streaming", true);
  } catch (err) {
    $("start").disabled = false;
    $("start").textContent = "Retry camera";
    setState("camera blocked", false);
    $("status").textContent = "Camera unavailable: " + (err.name || err) +
      " — " + (err.message || "") + ". getUserMedia needs HTTPS and a browser " +
      "that allows it; Safari and Chrome both work, in-app browsers often do not.";
  }
});
</script>
</body>
</html>
